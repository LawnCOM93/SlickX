<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계단 치수 자동 계산기</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1200px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2em;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .input-section {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 15px;
        }

        .input-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .calculate-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .calculate-btn:hover {
            transform: translateY(-2px);
        }

        .calculate-btn:active {
            transform: translateY(0);
        }

        .result-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .diagram {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            position: relative;
            min-height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            max-width: 100%;
            border-radius: 10px;
        }

        .results {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #ddd;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-label {
            color: #555;
            font-weight: 600;
        }

        .result-value {
            color: #667eea;
            font-weight: 700;
            font-size: 18px;
        }

        .warning {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            color: #856404;
        }

        .error {
            background: #f8d7da;
            border-left: 4px solid #dc3545;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            color: #721c24;
        }

        .info-text {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        @media (max-width: 968px) {
            .content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏗️ 계단 치수 자동 계산기</h1>
        
        <div class="content">
            <div class="input-section">
                <h2 style="margin-bottom: 20px; color: #333;">입력 값</h2>
                
                <div class="input-group">
                    <label for="height">층고 (수직 높이, mm)</label>
                    <input type="number" id="height" value="2400" min="1000" step="10">
                    <div class="info-text">전체 수직 높이</div>
                </div>

                <div class="input-group">
                    <label for="riserHeight">챌판 높이 (mm)</label>
                    <input type="number" id="riserHeight" value="185" min="100" step="5">
                    <div class="info-text">각 계단의 높이 (권장: 150-200mm)</div>
                </div>

                <div class="input-group">
                    <label for="treadDepth">디딤판 깊이 (mm)</label>
                    <input type="number" id="treadDepth" value="300" min="200" step="10">
                    <div class="info-text">발을 딛는 면의 깊이 (권장: 250-350mm)</div>
                </div>

                <button class="calculate-btn" onclick="calculate()">계산하기</button>
            </div>

            <div class="result-section">
                <div class="diagram">
                    <canvas id="stairCanvas" width="500" height="400"></canvas>
                </div>

                <div class="results" id="results">
                    <h2 style="margin-bottom: 15px; color: #333;">계산 결과</h2>
                    <div class="result-item">
                        <span class="result-label">계단 개수:</span>
                        <span class="result-value" id="resultSteps">-</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">챌판 높이:</span>
                        <span class="result-value" id="resultRiser">-</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">디딤판 깊이:</span>
                        <span class="result-value" id="resultTread">-</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">전체 가로 길이:</span>
                        <span class="result-value" id="resultWidth">-</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">경사 길이:</span>
                        <span class="result-value" id="resultSlope">-</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">경사각도:</span>
                        <span class="result-value" id="resultAngle">-</span>
                    </div>
                    <div id="warningBox"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function calculate() {
            // 입력 값 가져오기 (mm 단위)
            const height = parseFloat(document.getElementById('height').value);
            const riserHeight = parseFloat(document.getElementById('riserHeight').value);
            const treadDepth = parseFloat(document.getElementById('treadDepth').value);

            // 계단 개수 계산
            const steps = Math.ceil(height / riserHeight);
            
            // 실제 챌판 높이 재계산 (층고를 정확히 나누기 위해)
            const actualRiserHeight = height / steps;
            
            // 전체 가로 길이 계산
            const totalWidth = treadDepth * (steps - 1);
            
            // 경사 길이 계산
            const slopeLength = Math.sqrt(height * height + totalWidth * totalWidth);
            
            // 경사각도 계산
            const angle = Math.atan(height / totalWidth) * (180 / Math.PI);

            // 결과 표시 (mm 단위)
            document.getElementById('resultSteps').textContent = `${steps}개`;
            document.getElementById('resultRiser').textContent = `${actualRiserHeight.toFixed(1)}mm`;
            document.getElementById('resultTread').textContent = `${treadDepth.toFixed(0)}mm`;
            document.getElementById('resultWidth').textContent = `${totalWidth.toFixed(0)}mm`;
            document.getElementById('resultSlope').textContent = `${slopeLength.toFixed(0)}mm`;
            document.getElementById('resultAngle').textContent = `${angle.toFixed(1)}°`;

            // 권장 기준 체크 및 경고 메시지
            let warnings = [];
            let errors = [];

            // 챌판 높이 체크
            if (actualRiserHeight < 150) {
                warnings.push(`⚠️ 챌판 높이(${actualRiserHeight.toFixed(1)}mm)가 권장 최소값(150mm)보다 낮습니다. 계단이 너무 낮을 수 있습니다.`);
            } else if (actualRiserHeight > 200) {
                warnings.push(`⚠️ 챌판 높이(${actualRiserHeight.toFixed(1)}mm)가 권장 최대값(200mm)보다 높습니다. 계단이 너무 가파를 수 있습니다.`);
            }

            // 디딤판 깊이 체크
            if (treadDepth < 250) {
                warnings.push(`⚠️ 디딤판 깊이(${treadDepth}mm)가 권장 최소값(250mm)보다 짧습니다. 발을 딛기 불편할 수 있습니다.`);
            } else if (treadDepth > 350) {
                warnings.push(`⚠️ 디딤판 깊이(${treadDepth}mm)가 권장 최대값(350mm)보다 깊습니다.`);
            }

            // 경사각도 체크
            if (angle < 30) {
                warnings.push(`⚠️ 경사각도(${angle.toFixed(1)}°)가 권장 최소값(30°)보다 낮습니다. 계단이 너무 완만합니다.`);
            } else if (angle > 40) {
                warnings.push(`⚠️ 경사각도(${angle.toFixed(1)}°)가 권장 최대값(40°)보다 높습니다. 계단이 너무 가파릅니다.`);
            }

            // 입력 챌판 높이와 실제 계산된 챌판 높이의 차이가 큰 경우
            const heightDiff = Math.abs(riserHeight - actualRiserHeight);
            if (heightDiff > 5) {
                warnings.push(`ℹ️ 입력한 챌판 높이(${riserHeight}mm)가 실제 계산값(${actualRiserHeight.toFixed(1)}mm)과 ${heightDiff.toFixed(1)}mm 차이가 납니다. 층고를 정확히 나누기 위해 조정되었습니다.`);
            }

            // 경고 메시지 표시
            const warningBox = document.getElementById('warningBox');
            let messageHtml = '';
            
            if (errors.length > 0) {
                messageHtml += `<div class="error">${errors.join('<br>')}</div>`;
            }
            
            if (warnings.length > 0) {
                messageHtml += `<div class="warning">${warnings.join('<br>')}</div>`;
            }

            warningBox.innerHTML = messageHtml;

            // 다이어그램 그리기
            drawDiagram(height, totalWidth, steps, treadDepth, actualRiserHeight, slopeLength);
        }

        function drawDiagram(height, width, steps, treadDepth, riserHeight, slopeLength) {
            const canvas = document.getElementById('stairCanvas');
            const ctx = canvas.getContext('2d');
            
            // 캔버스 초기화
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 스케일 조정 (mm를 픽셀로 변환)
            const scale = Math.min(
                (canvas.width - 80) / width,
                (canvas.height - 80) / height
            );
            
            const offsetX = 40;
            const offsetY = canvas.height - 40;

            // 계단 그리기
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            
            for (let i = 0; i < steps; i++) {
                const x = offsetX + (i * treadDepth * scale);
                const y = offsetY - (i * riserHeight * scale);
                
                // 디딤판
                ctx.strokeRect(x, y - (riserHeight * scale), treadDepth * scale, riserHeight * scale);
                ctx.fillStyle = '#e9ecef';
                ctx.fillRect(x, y - (riserHeight * scale), treadDepth * scale, riserHeight * scale);
            }

            // 빨간색 삼각형 외곽선
            ctx.strokeStyle = '#dc3545';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(offsetX, offsetY);
            ctx.lineTo(offsetX + (width * scale), offsetY);
            ctx.lineTo(offsetX + (width * scale), offsetY - (height * scale));
            ctx.lineTo(offsetX, offsetY);
            ctx.stroke();

            // 화살표 그리기 함수
            function drawArrow(fromX, fromY, toX, toY) {
                const headLength = 8;
                const angle = Math.atan2(toY - fromY, toX - fromX);
                
                ctx.beginPath();
                ctx.moveTo(fromX, fromY);
                ctx.lineTo(toX, toY);
                ctx.lineTo(toX - headLength * Math.cos(angle - Math.PI / 6), 
                          toY - headLength * Math.sin(angle - Math.PI / 6));
                ctx.moveTo(toX, toY);
                ctx.lineTo(toX - headLength * Math.cos(angle + Math.PI / 6), 
                          toY - headLength * Math.sin(angle + Math.PI / 6));
                ctx.stroke();
            }

            // 치수 표기 (mm 단위)
            ctx.fillStyle = '#dc3545';
            ctx.strokeStyle = '#dc3545';
            ctx.font = 'bold 14px Arial';
            ctx.lineWidth = 2;
            
            // 가로 치수 (하단)
            const bottomY = offsetY + 25;
            drawArrow(offsetX, bottomY, offsetX + (width * scale), bottomY);
            ctx.fillText(`${width.toFixed(0)}mm`, 
                offsetX + (width * scale) / 2 - 30, 
                bottomY - 8);
            
            // 세로 치수 (우측)
            const rightX = offsetX + (width * scale) + 15;
            drawArrow(rightX, offsetY, rightX, offsetY - (height * scale));
            ctx.fillText(`${height.toFixed(0)}mm`, 
                rightX + 5, 
                offsetY - (height * scale) / 2);
            
            // 경사 치수 (중앙)
            const midX = offsetX + (width * scale) / 2;
            const midY = offsetY - (height * scale) / 2;
            ctx.fillText(`${slopeLength.toFixed(0)}mm`, midX - 40, midY - 10);

            // 디딤판 치수 (첫 번째 계단)
            if (steps > 0) {
                const treadY = offsetY - 10;
                drawArrow(offsetX, treadY, offsetX + (treadDepth * scale), treadY);
                ctx.fillText(`${treadDepth.toFixed(0)}mm`, 
                    offsetX + (treadDepth * scale) / 2 - 25, 
                    treadY - 8);
            }

            // 챌판 치수 (첫 번째 계단)
            if (steps > 0) {
                const riserX = offsetX - 25;
                drawArrow(riserX, offsetY, riserX, offsetY - (riserHeight * scale));
                ctx.fillText(`${riserHeight.toFixed(0)}mm`, 
                    offsetX - 60, 
                    offsetY - (riserHeight * scale) / 2 + 5);
            }
        }

        // 페이지 로드 시 초기 계산
        window.onload = function() {
            calculate();
        };

        // 입력 값 변경 시 자동 계산
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', calculate);
        });
    </script>
</body>
</html>
